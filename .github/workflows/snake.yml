name: Generate GitHub Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'   # runs every day at 03:00 UTC
  push:
    branches: [ main ]    # change if your default branch isn’t "main"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: narikholiya
          outputs: dist/github-snake.svg

      - name: Commit & push generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/github-snake.svg || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update contribution snake [skip ci]" || echo "No changes to commit"
            git push
          else
            echo "No changes to commit"
          fi
